<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable · Page not found — SOSAN</title>
<!--
  Apache serves one ErrorDocument for both /fr/ and /en/, and at that point the
  visitor's language is unknown — so this page is bilingual and standalone.
  Copied into out/ by scripts/postbuild.mjs. Edit it here, never on the server.
-->
<style>
  :root { --navy:#0e2033; --muted:#4c5b6a; --green:#0fb36a; --green-dark:#0a8f54; --border:#eaf1ee; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px; background:#fff; color:var(--navy);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    text-align:center; line-height:1.6;
  }
  main { max-width:520px; }
  .code { font-size:64px; font-weight:800; letter-spacing:-.02em; margin:0 0 8px; }
  h1 { font-size:22px; margin:0 0 6px; }
  h2 { font-size:17px; font-weight:600; color:var(--muted); margin:0 0 6px; }
  p { color:var(--muted); margin:0 0 4px; font-size:15px; }
  .sep { height:1px; background:var(--border); margin:26px 0; }
  .actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:28px; }
  a {
    display:inline-block; padding:12px 22px; border-radius:999px; text-decoration:none;
    font-weight:600; font-size:15px; background:var(--green); color:#fff;
  }
  a:hover { background:var(--green-dark); }
  a.alt { background:#fff; color:var(--navy); border:1px solid var(--border); }
</style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1 lang="fr">Cette page n’existe pas</h1>
    <p lang="fr">Le lien que vous avez suivi est peut-être incorrect, ou la page a été déplacée.</p>
    <div class="sep"></div>
    <h2 lang="en">This page doesn’t exist</h2>
    <p lang="en">The link you followed may be broken, or the page may have moved.</p>
    <div class="actions">
      <a href="/fr/" hreflang="fr" lang="fr">Retour à l’accueil</a>
      <a class="alt" href="/en/" hreflang="en" lang="en">Back to home</a>
    </div>
  </main>
</body>
</html>
