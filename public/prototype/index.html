<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex, nofollow"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SOSAN Patient Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: three-column review console. Left: flow map. Centre: one 360 px phone running the prototype. Right: what changed on this screen and which code it maps to. Stacks to phone-first on small screens. */
:root{
  --bg:#EEF2F7; --panel:#FFFFFF; --ink:#0F1C2B; --muted:#56636F; --line:#DCE3EB; --accent:#0071B2; --accent-soft:#E3F2FD; --device:#1B2321;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* app tokens — fixed light, from sosan-tokens.json */
  --a-font:"Plus Jakarta Sans",system-ui,sans-serif;
  --primary:#0071B2;--primary-pressed:#005A8F;--primary-soft:#E3F2FD;--brand:#36B5FF;--sky-soft:#D9F0FF;--leaf:#7CD957;--leaf-soft:#EAF8E2;
  --a-ink:#0B2236;--a-muted:#536273;--placeholder:#657385;--disabled:#8C99A6;
  --a-bg:#F3F7FB;--surface:#FFFFFF;--a-line:#E1E8EF;--line-control:#7B8898;
  --info:#0071B2;--info-soft:#E3F2FD;--success:#17663A;--success-soft:#E6F4EA;--warning:#8A4B00;--warning-soft:#FFF1DC;--danger:#B42318;--danger-soft:#FDECEA;--notif:#D92D20;
  --grad:linear-gradient(120deg,#36B5FF 0%,#7CD957 100%);
  --grad-deep:linear-gradient(120deg,#0B5D8F 0%,#0A6B4F 100%);
  --e1:0 1px 2px rgba(11,34,54,.06),0 6px 18px -10px rgba(11,34,54,.18);
  --e2:0 -12px 30px -18px rgba(11,34,54,.35);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0D131A;--panel:#141C25;--ink:#E6EDF5;--muted:#9AA8B6;--line:#263241;--accent:#7CC4F2;--accent-soft:#16283A;--device:#05080A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D131A;--panel:#141C25;--ink:#E6EDF5;--muted:#9AA8B6;--line:#263241;--accent:#7CC4F2;--accent-soft:#16283A;--device:#05080A;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0;padding-inline:16px;padding-block:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.console{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:20px;align-items:start}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}

/* left: map */
.map{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:4px}
.map-head{display:flex;flex-direction:column;gap:8px}
.map-head img{height:24px;width:auto;align-self:flex-start}
.map-head h1{font-size:22px;line-height:1.1}
.map-head p{margin:0;font-size:12.5px;color:var(--muted)}
.lang{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel);align-self:flex-start}
.lang button{font:700 12px var(--f-body);border:0;border-radius:999px;padding:5px 14px;background:transparent;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.flow{display:flex;flex-direction:column;gap:2px}
.flow h2{font-size:11px;font-family:var(--f-body);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px 2px}
.flow button{font:500 13px var(--f-body);text-align:left;border:0;background:transparent;color:var(--ink);padding:6px 8px;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:center}
.flow button:hover{background:var(--panel)}
.flow button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.flow button .n{font-size:11px;color:var(--muted);min-width:18px;font-variant-numeric:tabular-nums}

/* centre */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.toolbar{width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px;align-items:center}
.toolbar .where{font:700 15px var(--f-body);text-align:center}
.states{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.states .lbl{font-size:12px;color:var(--muted);align-self:center}
.states button{font:600 12px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
.states button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.device{width:378px;max-width:100%;height:800px;border-radius:46px;background:var(--device);padding:9px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.screen{position:relative;height:100%;border-radius:38px;overflow:hidden;background:var(--a-bg);font-family:var(--a-font);color:var(--a-ink);font-size:14px;line-height:1.4;display:flex;flex-direction:column}
.hint{font-size:12px;color:var(--muted);text-align:center;max-width:360px}

/* right: notes */
.notes{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.notes h3{font-size:17px}
.notes .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.notes code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 5px;word-break:break-word}

@media (max-width:1180px){.console{grid-template-columns:220px minmax(0,1fr)}.notes{grid-column:1/-1;position:static;max-height:none}}
@media (max-width:760px){.console{grid-template-columns:1fr}.map{position:static;max-height:none;order:2}.stage{order:1}.notes{order:3}.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.flow h2{grid-column:1/-1}.device{height:740px}}

/* ======== APP ======== */
.status{height:36px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font:700 13px var(--a-font);color:var(--a-ink)}
.status.light{color:#fff}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 20px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.content.flush{padding:0 0 20px}
.content>*{flex-shrink:0}
.foot{flex:none;padding:12px 20px 18px;background:var(--surface);border-top:1px solid var(--a-line);display:flex;flex-direction:column;gap:10px}
.foot.clear{background:transparent;border-top:0}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.xs{width:14px;height:14px}.ic.lg{width:28px;height:28px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}
.t-display{font:800 30px/36px var(--a-font);letter-spacing:-.02em}
.t-title{font:800 26px/32px var(--a-font);letter-spacing:-.02em}
.t-ttl{font:700 20px/26px var(--a-font);letter-spacing:-.01em}
.t-h{font:700 16.5px/23px var(--a-font)}
.t-b{font:400 15px/22px var(--a-font)}
.t-bl{font:500 15.5px/23px var(--a-font)}
.t-s{font:500 13px/18px var(--a-font);color:var(--a-muted)}
.t-c{font:500 12px/16px var(--a-font);color:var(--a-muted)}
.ink{color:var(--a-ink)}
.ov{font:700 11px/14px var(--a-font);letter-spacing:.06em;text-transform:uppercase;color:var(--a-muted);display:flex;gap:6px;align-items:center}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--e1)}
.pad{padding:14px;display:flex;flex-direction:column;gap:12px}
.sep{height:1px;background:var(--a-line);flex:none}
.tap{cursor:pointer}
.tap:active{transform:scale(.985)}
@media (prefers-reduced-motion: reduce){.tap:active{transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15px/20px var(--a-font);border:0;border-radius:14px;padding:14px 18px;min-height:50px;cursor:pointer;background:var(--primary);color:#fff;text-decoration:none;text-align:center}
.btn:active{background:var(--primary-pressed)}
.btn.block{width:100%}
.btn.sec{background:var(--surface);color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--primary)}
.btn.ter{background:transparent;color:var(--info);min-height:40px;padding:8px}
.btn.dng{background:var(--danger)}
.btn.sm{min-height:38px;padding:8px 14px;font-size:13.5px;border-radius:12px}
.btn.white{background:#fff;color:var(--primary)}
.btn[aria-disabled="true"]{background:#E7ECE9;color:var(--disabled);box-shadow:none}
.iconbtn{width:44px;height:44px;border-radius:999px;background:var(--surface);border:1px solid var(--a-line);display:grid;place-items:center;flex:none;position:relative;cursor:pointer;color:var(--a-ink)}
.iconbtn.ghost{background:transparent;border:0}
.dotn{min-width:18px;height:18px;border-radius:999px;background:var(--notif);color:#fff;font:800 10.5px/18px var(--a-font);text-align:center;padding:0 5px;display:inline-block}
.iconbtn .dotn{position:absolute;top:-3px;right:-3px}
.bar{display:flex;align-items:center;gap:8px;padding:2px 0}
.bar .t-h{flex:1;text-align:center}
.bar .sp{width:44px;flex:none}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:800 16px var(--a-font);flex:none;background:var(--primary-soft);color:var(--primary)}
.avatar.sq{border-radius:14px}
.avatar.s{width:40px;height:40px;font-size:14px}
.avatar.lg{width:88px;height:88px;font-size:28px}
.photo{border-radius:50%;flex:none;background:linear-gradient(160deg,#D2BFA6,#8F7058);position:relative;overflow:hidden}
.photo::after{content:"";position:absolute;left:50%;top:54%;width:62%;height:62%;border-radius:50%;transform:translateX(-50%);background:#5E463A;box-shadow:0 30px 0 12px #2F4F6B}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--a-font);padding:6px 9px;border-radius:999px;background:var(--a-bg);color:var(--a-ink);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;font:700 11.5px var(--a-font);padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--success-soft);color:var(--success)}.b-wait{background:var(--warning-soft);color:var(--warning)}.b-bad{background:var(--danger-soft);color:var(--danger)}.b-info{background:var(--info-soft);color:var(--info)}.b-neu{background:#EDF1F5;color:#3E4A57}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--a-line);border-radius:14px;padding:13px 14px;color:var(--placeholder);font:400 15px var(--a-font);cursor:pointer}
.search.on{border:2px solid var(--primary);padding:12px 13px;color:var(--a-ink);font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 13px var(--a-font);padding:8px 13px;border-radius:999px;background:var(--surface);border:1.5px solid var(--a-line);color:var(--a-ink);white-space:nowrap;cursor:pointer;flex:none}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--a-ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#E5ECF3;border-radius:14px;padding:4px;gap:4px}
.seg button{font:600 13.5px var(--a-font);border:0;border-radius:10px;padding:9px 6px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--a-muted);background:transparent;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--a-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.choice{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--a-line);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.choice.on{border:2px solid var(--primary);padding:13.5px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-control);flex:none}
.choice.on .radio{border:7px solid var(--primary)}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-control);flex:none;display:grid;place-items:center;color:#fff}
.check.on{background:var(--primary);border-color:var(--primary)}
.switch{width:46px;height:28px;border-radius:999px;background:#C8D2DC;position:relative;flex:none;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .12s}
.switch.on{background:var(--primary)}.switch.on::after{left:21px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font:700 13px var(--a-font);color:var(--a-ink)}
.in{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line-control);border-radius:14px;padding:12px 14px;min-height:50px;font:500 16px var(--a-font);color:var(--a-ink)}
.in .ph{color:var(--placeholder);font-weight:400}
.in.focus{border:2px solid var(--primary);padding:11.5px 13.5px}
.in.err{border:2px solid var(--danger);padding:11.5px 13.5px}
.in.area{min-height:88px;align-items:flex-start}
input.in{width:100%;outline:none;font:500 16px var(--a-font);color:var(--a-ink)}
input.in::placeholder{color:var(--placeholder);font-weight:400}
input.in:focus{border:2px solid var(--primary);padding:11.5px 13.5px}
.help{font:500 12px var(--a-font);color:var(--a-muted)}
.help.err{color:var(--danger);display:flex;gap:6px;align-items:center}
.cc{display:flex;align-items:center;gap:6px;padding-right:10px;border-right:1px solid var(--a-line);font-weight:700}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp span{height:56px;border:1.5px solid var(--line-control);border-radius:12px;background:var(--surface);display:grid;place-items:center;font:800 22px var(--a-font)}
.otp span.f{border:2px solid var(--primary)}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lnk{font:700 13px var(--a-font);color:var(--info);cursor:pointer;white-space:nowrap}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.q{display:flex;flex-direction:column;align-items:center;gap:7px;font:600 12px/15px var(--a-font);text-align:center;cursor:pointer}
.q .qi{width:60px;height:60px;border-radius:18px;background:var(--surface);box-shadow:var(--e1);color:var(--primary);display:grid;place-items:center}
.next{background:var(--primary);color:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 24px -14px rgba(0,113,178,.55);cursor:pointer}
.next .t-s,.next .t-c{color:rgba(255,255,255,.8)}
.next .pill{background:rgba(255,255,255,.14);color:#fff}
.next .avatar{background:rgba(255,255,255,.16);color:#fff}
.member{border-radius:20px;background:var(--grad);color:var(--a-ink);padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;cursor:pointer}
.member::before{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.28)}
.member>*{position:relative}
.member .lbl{font:600 10.5px var(--a-font);opacity:.85;letter-spacing:.05em;text-transform:uppercase}
.member .val{font:700 14.5px var(--a-font)}
.qr{background:#fff;border-radius:10px;padding:5px;width:64px;height:64px;flex:none}
.promo{border-radius:20px;padding:16px;display:flex;gap:12px;align-items:center;background:var(--surface);box-shadow:var(--e1);flex:none;width:262px;cursor:pointer}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin-inline:-20px;padding:2px 20px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.tip{width:190px;flex:none;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.tip .ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.banner{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px}
.banner.info{background:var(--info-soft);color:#0F3E6E}
.banner.warn{background:var(--warning-soft);color:#5C3200}
.banner.bad{background:var(--danger-soft);color:#7A1A12}
.banner.ok{background:var(--success-soft);color:#0F4A29}
.banner.plain{background:var(--surface);box-shadow:var(--e1);cursor:pointer}
.tabbar{flex:none;margin:6px 12px 14px;background:var(--surface);border:1px solid var(--a-line);border-radius:26px;display:grid;grid-template-columns:repeat(5,1fr);padding:9px 2px 9px;box-shadow:var(--e2)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 10.5px var(--a-font);color:var(--a-muted);position:relative;white-space:nowrap;letter-spacing:-.01em;cursor:pointer;border:0;background:transparent;padding:0}
.tab.on{color:var(--primary)}
.tab.on::before{content:"";position:absolute;top:-9px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--grad)}
.tab .dotn{position:absolute;top:-6px;left:calc(50% + 4px)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.li+.li{border-top:1px solid var(--a-line)}
.li .lii{width:38px;height:38px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.chev{color:var(--a-muted)}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day{border:1.5px solid var(--a-line);border-radius:14px;padding:8px 2px;text-align:center;display:flex;flex-direction:column;gap:1px;background:var(--surface);cursor:pointer;font:inherit;color:inherit}
.day .d{font:600 11px var(--a-font);color:var(--a-muted)}
.day .n{font:800 18px var(--a-font)}
.day .s{font:700 10px var(--a-font);color:var(--primary)}
.day.full{opacity:.45;cursor:not-allowed}.day.full .s{color:var(--a-muted)}
.day.on{background:var(--primary);border-color:var(--primary);color:#fff}.day.on .d,.day.on .s{color:#fff}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{font:700 13.5px var(--a-font);font-variant-numeric:tabular-nums;border:1.5px solid var(--a-line);border-radius:10px;padding:10px 0;text-align:center;background:var(--surface);cursor:pointer;color:var(--a-ink)}
.slot.off{text-decoration:line-through;color:var(--disabled);cursor:not-allowed}
.slot.on{background:var(--primary);border-color:var(--primary);color:#fff}
.method{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--a-line);border-radius:16px;background:var(--surface);cursor:pointer}
.method.on{border:2px solid var(--primary);padding:11.5px 13.5px}
.method.on .radio{border:7px solid var(--primary)}
.mark{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font:800 11px var(--a-font);flex:none}
.m-momo{background:#FFCB05;color:#1B1B1B}.m-om{background:#111;color:#FF7900}.m-card{background:var(--a-bg);color:var(--a-ink)}
.line{display:flex;justify-content:space-between;gap:10px;font:500 14px var(--a-font)}
.line b{font-variant-numeric:tabular-nums;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;border-top:1px dashed var(--a-line);font:800 15px var(--a-font)}
.total b{font:800 20px var(--a-font);font-variant-numeric:tabular-nums}

  if((t=e.target.closest("[data-mx]"))){var mi=+t.getAttribute("data-mx");S.sel.mx[mi]=!S.sel.mx[mi];render(true);return;}
  t=e.target.closest("[data-set],[data-go],[data-back],[data-tab],[data-st]");if(!t)return;
  if(t.getAttribute("aria-disabled")==="true"||t.disabled)return;
  if(t.hasAttribute("data-set"))parseSet(t.getAttribute("data-set"));
  if(t.hasAttribute("data-st")){var p=t.getAttribute("data-st").split("=");S.st[p[0]]=p[1];}
  if(t.hasAttribute("data-tab")){S.stack=[t.getAttribute("data-tab")];render();return;}
  if(t.hasAttribute("data-back")){if(S.stack.length>1)S.stack.pop();render(true);return;}
  if(t.hasAttribute("data-go")){var g=t.getAttribute("data-go");if(g!==cur())S.stack.push(g);render(g===cur()&&!t.hasAttribute("data-go"));return;}
  render(true);
});

 if(t.getAttribute("data-pf")==="n"){p.n=t.value;}
 else{var d=t.value.replace(/[^0-9]/g,"").slice(0,8);var f=d.length>4?d.slice(0,2)+"/"+d.slice(2,4)+"/"+d.slice(4):d.length>2?d.slice(0,2)+"/"+d.slice(2):d;if(f!==t.value)t.value=f;p.dob=f;var a=ageOf(f);var h=document.getElementById("ph"+i);if(h){h.textContent=helpFor(a,f);h.className="help"+(a!==null&&a>75?" bad":"");}var ch=document.getElementById("pa"+i);if(ch){ch.hidden=a===null;ch.textContent=a===null?"":a+L(" ans"," yrs");}}
 coverGoState();});
var start=(location.hash||"").replace("#","");if(SC[start]){var rr=rootOf(start);S.stack=start===rr?[start]:[rr,start];}
render();
})();
